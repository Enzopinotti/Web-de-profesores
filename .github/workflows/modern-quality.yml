name: Modern app quality

on:
  pull_request:
    paths:
      - "modern/**"
      - "README.md"
      - "docs/**"
      - ".editorconfig"
      - ".gitignore"
      - ".nvmrc"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "modern/**"
      - "README.md"
      - "docs/**"
      - ".editorconfig"
      - ".gitignore"
      - ".nvmrc"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: modern-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: modern

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: modern/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: modern/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run modern app quality contract
        run: pnpm check
