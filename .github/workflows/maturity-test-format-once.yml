name: Maturity app test format once

on:
  push:
    branches:
      - feat/2026-maturity-data-continuity
    paths:
      - ".github/workflows/maturity-test-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/2026-maturity-data-continuity
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: modern/package.json
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - name: Install locked dependencies
        working-directory: modern
        run: pnpm install --frozen-lockfile
      - name: Format app test
        working-directory: modern
        run: pnpm exec prettier --write src/tests/app.test.ts
      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modern/src/tests/app.test.ts
          git commit -m "style: format maturity app test"
          git push origin HEAD:feat/2026-maturity-data-continuity
