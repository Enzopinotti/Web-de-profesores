name: Bootstrap modern workspace once

on:
  push:
    branches:
      - modernization/2026-modderhouse-v1
    paths:
      - modern/package.json
      - modern/pnpm-workspace.yaml
      - modern/vite.config.ts
      - modern/src/tests/document-contract.test.ts
      - .github/workflows/bootstrap-modern-once.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out modernization branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: modernization/2026-modderhouse-v1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: modern/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc

      - name: Install and lock dependencies under policy
        working-directory: modern
        run: pnpm install --no-frozen-lockfile

      - name: Apply canonical formatting
        working-directory: modern
        run: pnpm exec prettier --write . ../README.md ../docs/**/*.md

      - name: Validate complete modern contract
        working-directory: modern
        run: pnpm check

      - name: Commit lockfile and canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modern README.md docs
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: lock and format modern workspace"
          git push origin HEAD:modernization/2026-modderhouse-v1
